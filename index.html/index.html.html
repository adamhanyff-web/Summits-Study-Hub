<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Hub</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fa;font:15px Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:240px;position:fixed;inset:0 auto 0 0;background:#0d1016;border-right:1px solid #232936;padding:22px 14px}.brand{font-size:22px;font-weight:800;padding:0 10px 28px}.brand i{color:#7c83ff;font-style:normal}.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#929baa;padding:11px;border-radius:10px;margin:3px 0}.nav button:hover,.nav .on{background:#191e28;color:white}.main{margin-left:240px;width:calc(100% - 240px);padding:30px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}h1{margin:0;font-size:32px;letter-spacing:-1px}h2{margin:0 0 15px}h3{margin:0 0 7px}.muted{color:#8992a1}.btn{border:1px solid #2b3340;background:#151a22;color:#fff;border-radius:9px;padding:10px 14px}.primary{background:#6d73ff;border-color:#6d73ff}.danger{color:#ff9696}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:25px}.card{background:#11151d;border:1px solid #242b37;border-radius:14px;padding:17px}.stat strong{font-size:26px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}.subject{cursor:pointer;transition:.15s}.subject:hover{transform:translateY(-2px);border-color:#3c4658}.icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:#202738;margin-bottom:14px;font-size:20px}.progress{height:7px;background:#252c37;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#747bff;border-radius:99px}.search{width:min(500px,100%);background:#11151d;border:1px solid #29303b;color:white;border-radius:10px;padding:11px 13px;outline:none}.topic{cursor:pointer;margin-bottom:10px;display:flex;justify-content:space-between}.topic:hover{background:#171c25}.tag{font-size:12px;border:1px solid #303744;border-radius:99px;padding:4px 8px;color:#b8c0cc}.empty{text-align:center;padding:40px;border:1px dashed #303744;border-radius:14px;color:#8992a1}.modalbg{display:none;position:fixed;inset:0;background:#000b;place-items:center;z-index:50;padding:20px}.modal{width:min(520px,100%);background:#11151d;border:1px solid #303744;border-radius:16px;padding:22px}.modal input,.modal textarea,.modal select{width:100%;background:#0a0d12;color:white;border:1px solid #2b3340;border-radius:9px;padding:11px;margin:6px 0 13px;outline:none}.modal textarea{min-height:140px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:8px}.mobile{display:none}@media(max-width:800px){.side{display:none}.main{margin:0;width:100%;padding:20px 15px 75px}.stats{grid-template-columns:repeat(2,1fr)}.mobile{display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0d1016;border-top:1px solid #232936;justify-content:space-around;padding:8px}.mobile button{background:none;border:0;color:#aaa;padding:8px}.top{align-items:start;flex-direction:column}}

.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#182238 0,#0b0f17 45%,#070a10 100%)}
.auth-box{width:min(430px,100%);background:#111722;border:1px solid #263044;border-radius:22px;padding:30px;box-shadow:0 24px 70px #0008}.auth-brand{font-size:28px;font-weight:800;margin-bottom:8px}.auth-brand i{font-style:normal;color:#7c8cff}.auth-sub{color:#8994a8;margin:0 0 24px}.auth-tabs{display:flex;background:#0b1018;border-radius:12px;padding:4px;margin-bottom:20px}.auth-tabs button{flex:1;border:0;background:transparent;color:#8e99aa;padding:10px;border-radius:9px;cursor:pointer}.auth-tabs button.on{background:#202a3d;color:#fff}.auth-form{display:grid;gap:12px}.auth-form label{font-size:13px;color:#aab4c5}.auth-form input{width:100%;box-sizing:border-box;background:#0b1018;border:1px solid #293449;color:#fff;padding:12px 13px;border-radius:10px;outline:none}.auth-form input:focus{border-color:#7383ff}.auth-btn{width:100%;border:0;border-radius:10px;padding:12px;font-weight:700;background:#7383ff;color:white;cursor:pointer;margin-top:4px}.auth-link{border:0;background:none;color:#8796ff;cursor:pointer;padding:5px 0;text-align:left}.auth-error{min-height:18px;color:#ff7d8b;font-size:13px}.auth-info{font-size:12px;color:#727e91;line-height:1.5;margin-top:14px}.user-chip{margin-top:auto;padding:14px;border-top:1px solid #202938;color:#9aa5b6;font-size:12px}.user-chip strong{display:block;color:#fff;font-size:13px;margin-bottom:3px}.logout-btn{margin-top:9px;width:100%;border:1px solid #2a3447;background:#151c29;color:#c5ccda;padding:9px;border-radius:9px;cursor:pointer}
</style></head><body><div id="auth"></div><div class="app" id="mainApp" style="display:none"><aside class="side"><div class="brand">Study<i>Hub</i></div><nav class="nav"><button data-p="home">⌂ &nbsp; Home</button><button data-p="subjects">▦ &nbsp; Subjects</button><button data-p="recent">◷ &nbsp; Recently Studied</button><button data-p="favorites">★ &nbsp; Favorites</button><button data-p="search">⌕ &nbsp; Search</button><button data-p="settings">⚙ &nbsp; Settings</button></nav><div class="user-chip"><strong id="sideUserName"></strong><span id="sideUserEmail"></span><button class="logout-btn" onclick="logout()">Sign out</button></div></aside><main class="main" id="app"></main></div><div class="mobile"><button onclick="go('home')">⌂</button><button onclick="go('subjects')">▦</button><button onclick="go('recent')">◷</button><button onclick="go('favorites')">★</button><button onclick="go('settings')">⚙</button></div><div class="modalbg" id="mb"><div class="modal" id="m"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://usgmagokvbfddpnhcpvm.supabase.co";
const SUPABASE_KEY="sb_publishable_6SeqcKsKlqpj8SKB6W_cqQ_9EyOv1Xi";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let CLOUD_GROUP_ID=null;
let CLOUD_READY=false;

const KEY='studyhub-data';
const USERS_KEY='studyhub-users';
const SESSION_KEY='studyhub-session';
const GROUP_CODE='qwerty-123456';
let USERS=JSON.parse(localStorage.getItem(USERS_KEY)||'[]');
let CURRENT_USER=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
function saveUsers(){localStorage.setItem(USERS_KEY,JSON.stringify(USERS))}
function saveSession(){if(CURRENT_USER)localStorage.setItem(SESSION_KEY,JSON.stringify(CURRENT_USER));else localStorage.removeItem(SESSION_KEY)}
function auth(){if(CURRENT_USER){document.getElementById('auth').innerHTML='';document.getElementById('mainApp').style.display='';return}document.getElementById('mainApp').style.display='none';showLogin()}
function authError(t){document.getElementById('authError').textContent=t||''}
function showLogin(){document.getElementById('auth').innerHTML=`<div class="auth-screen"><div class="auth-box"><div class="auth-brand">Study<i>Hub</i></div><p class="auth-sub">Your study space, all in one place.</p><div class="auth-tabs"><button class="on" onclick="showLogin()">Log in</button><button onclick="showSignup()">Sign up</button></div><form class="auth-form" onsubmit="login(event)"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Your password"><div id="authError" class="auth-error"></div><button class="auth-btn">Log in</button><button type="button" class="auth-link" onclick="showReset()">Forgot password?</button></form><div class="auth-info">Create an account with the shared group code. Account passwords are separate from the editing password.</div></div></div>`}
function showSignup(){document.getElementById('auth').innerHTML=`<div class="auth-screen"><div class="auth-box"><div class="auth-brand">Study<i>Hub</i></div><p class="auth-sub">Create your Study Hub account.</p><div class="auth-tabs"><button onclick="showLogin()">Log in</button><button class="on" onclick="showSignup()">Sign up</button></div><form class="auth-form" onsubmit="signup(event)"><label>Name</label><input id="signupName" type="text" autocomplete="name" required placeholder="Your name"><label>Email</label><input id="signupEmail" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input id="signupPassword" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters"><label>Confirm password</label><input id="signupConfirm" type="password" autocomplete="new-password" required placeholder="Repeat your password"><label>Group code</label><input id="signupGroup" value="qwerty-123456" autocomplete="off" type="text" required><div id="authError" class="auth-error"></div><button class="auth-btn">Create account</button></form><div class="auth-info">Join the shared Study Hub group using the group code. Account passwords are separate from the editing password.</div></div></div>`}
function showReset(){document.getElementById('auth').innerHTML=`<div class="auth-screen"><div class="auth-box"><div class="auth-brand">Study<i>Hub</i></div><p class="auth-sub">Reset your local account password.</p><form class="auth-form" onsubmit="resetPassword(event)"><label>Email</label><input id="resetEmail" type="email" required placeholder="you@example.com"><label>Group code</label><input id="resetGroup" type="text" required placeholder="Enter group code"><label>New password</label><input id="resetPassword" type="password" required minlength="6" placeholder="At least 6 characters"><div id="authError" class="auth-error"></div><button class="auth-btn">Reset password</button><button type="button" class="auth-link" onclick="showLogin()">Back to login</button></form><div class="auth-info">Because this version is HTML-only, password recovery is local and does not send an email.</div></div></div>`}
function login(e){e.preventDefault();authError('');let email=document.getElementById('loginEmail').value.trim().toLowerCase(),pw=document.getElementById('loginPassword').value;let u=USERS.find(x=>x.email===email);if(!u||u.password!==pw)return authError('Incorrect email or password.');CURRENT_USER={id:u.id,name:u.name,email:u.email,group:u.group};saveSession();auth();render()}
function signup(e){e.preventDefault();authError('');let name=document.getElementById('signupName').value.trim(),email=document.getElementById('signupEmail').value.trim().toLowerCase(),pw=document.getElementById('signupPassword').value,cp=document.getElementById('signupConfirm').value,group=(document.getElementById('signupGroup').value||'').replace(/[\u200B\u200C\u200D\uFEFF]/g,'').trim().toLowerCase();if(group!==GROUP_CODE.toLowerCase())return authError('Invalid group code. Use: qwerty-123456');if(pw!==cp)return authError('Passwords do not match.');if(USERS.some(x=>x.email===email))return authError('An account with this email already exists.');let u={id:uid(),name,email,password:pw,group};USERS.push(u);saveUsers();CURRENT_USER={id:u.id,name,email,group};saveSession();auth();render()}
function resetPassword(e){e.preventDefault();authError('');let email=document.getElementById('resetEmail').value.trim().toLowerCase(),group=document.getElementById('resetGroup').value.trim(),pw=document.getElementById('resetPassword').value,u=USERS.find(x=>x.email===email);if(group!==GROUP_CODE)return authError('Invalid group code.');if(!u)return authError('No account was found with that email.');u.password=pw;saveUsers();showLogin();setTimeout(()=>{let el=document.getElementById('authError');if(el)el.textContent='Password reset. You can log in now.'},0)}
function logout(){CURRENT_USER=null;saveSession();auth();location.hash='';}
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{subjects:[['Biology','🧬','#8b5cf6',['Macromolecules','Carbohydrates','Proteins','Nucleic Acids']],['Mathematics','∑','#3b82f6',[]],['Physics','⚛','#06b6d4',[]],['English','Aa','#f59e0b',[]],['French','Fr','#ec4899',[]],['History','⌛','#10b981',[]]].map(([name,icon,color,topics])=>({id:uid(),name,icon,color,topics:topics.map(n=>topic(n))})),recent:[]};function uid(){return crypto.randomUUID()}function topic(name){return{id:uid(),name,status:'Not Started',progress:0,favorite:false,notes:'',updated:Date.now()}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}function all(){return S.subjects.flatMap(s=>s.topics.map(t=>({...t,sid:s.id,sname:s.name})))}function prog(s){return s.topics.length?Math.round(s.topics.reduce((a,t)=>a+t.progress,0)/s.topics.length):0}function total(){let a=all();return a.length?Math.round(a.reduce((x,t)=>x+t.progress,0)/a.length):0}function go(p,x=''){location.hash=p+(x?'/'+x:'');render()}function route(){let [p,x]=location.hash.slice(1).split('/');return[p||'home',x]}function lock(fn){modal('Editing password',`<p class="muted">Reading is open to everyone. Enter the editing password to change shared content.</p><input id="pw" type="password" placeholder="Password">`,()=>{const password=document.getElementById('pw').value;if(password==='5535548'){close();fn()}else alert('Incorrect password.')})}function modal(title,body,ok){mb.style.display='grid';m.innerHTML=`<h2>${title}</h2>${body}<div class="modalfoot"><button class="btn" onclick="close()">Cancel</button><button class="btn primary" id="ok">Save</button></div>`;document.getElementById('ok').onclick=ok}function close(){mb.style.display='none'}
function render(){if(!CURRENT_USER){auth();return}document.getElementById('sideUserName').textContent=CURRENT_USER.name;document.getElementById('sideUserEmail').textContent=CURRENT_USER.email;let[p,x]=route();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));if(p==='subject')return subject(x);if(p==='topic')return topicPage(x);({home,subjects,recent,favorites,search,settings}[p]||home)()}
function header(title,sub,buttons=''){app.innerHTML=`<div class="top"><div><h1>${title}</h1><div class="muted">${sub||''}</div></div><div class="actions">${buttons}</div></div>`}
function home(){header('Study Hub','Your shared study workspace',`<button class="btn primary" onclick="addSubject()">＋ Add Subject</button>`);app.innerHTML+=`<div class="stats"><div class="card stat"><span class="muted">Overall progress</span><br><strong>${total()}%</strong><div class="progress"><div class="bar" style="width:${total()}%"></div></div></div><div class="card stat"><span class="muted">Subjects</span><br><strong>${S.subjects.length}</strong></div><div class="card stat"><span class="muted">Topics</span><br><strong>${all().length}</strong></div><div class="card stat"><span class="muted">Favorites</span><br><strong>${all().filter(t=>t.favorite).length}</strong></div></div><div class="top"><h2>Subjects</h2><input class="search" placeholder="Search everything..." oninput="if(this.value)go('search')"></div><div class="grid">${S.subjects.map(subjectCard).join('')}</div>`}
function subjectCard(s){return`<div class="card subject" onclick="go('subject','${s.id}')"><div class="icon" style="color:${s.color}">${esc(s.icon)}</div><div style="display:flex;justify-content:space-between"><h3>${esc(s.name)}</h3><span class="muted">${s.topics.length}</span></div><div class="progress"><div class="bar" style="width:${prog(s)}%;background:${s.color}"></div></div><small class="muted">${prog(s)}% complete</small></div>`}function subjects(){header('Subjects','All subjects',`<button class="btn primary" onclick="addSubject()">＋ Add Subject</button>`);app.innerHTML+=`<div class="grid">${S.subjects.map(subjectCard).join('')}</div>`}
function subject(id){let s=S.subjects.find(a=>a.id===id);if(!s)return go('subjects');header(s.name,`${s.topics.length} topics · ${prog(s)}% complete`,`<button class="btn" onclick="editSubject('${id}')">Edit</button><button type="button" class="btn danger" data-delete-subject="${id}">Delete</button><button class="btn primary" onclick="addTopic('${id}')">＋ Add Topic</button>`);app.innerHTML+=`<button class="btn" onclick="go('subjects')">← Subjects</button><div style="margin-top:18px">${s.topics.length?s.topics.map(t=>`<div class="card topic" onclick="go('topic','${id}:${t.id}')"><div><div style="display:flex;gap:8px;align-items:center"><h3>${esc(t.name)}</h3>${t.favorite?'★':''}</div><div class="muted">${esc(t.notes||'No notes yet.').slice(0,120)}</div><div class="progress"><div class="bar" style="width:${t.progress}%"></div></div><span class="tag">${t.status} · ${t.progress}%</span></div><b>›</b></div>`).join(''):'<div class="empty">No topics yet.</div>'}</div>`}
function topicPage(key){let[a,b]=key.split(':');let s=S.subjects.find(x=>x.id===a),t=s?.topics.find(x=>x.id===b);if(!t)return go('home');S.recent=[key,...S.recent.filter(x=>x!==key)].slice(0,10);save();header(t.name,`${s.name} · ${t.status} · ${t.progress}%`,`<button class="btn" onclick="fav('${a}','${b}')">${t.favorite?'★ Favorited':'☆ Favorite'}</button><button class="btn" onclick="editTopic('${a}','${b}')">Edit</button>`);app.innerHTML+=`<button class="btn" onclick="go('subject','${a}')">← ${esc(s.name)}</button><div class="card" style="margin-top:18px"><div class="top"><div><h3>Progress</h3><span class="muted">Update your study progress</span></div><b>${t.progress}%</b></div><div class="progress"><div class="bar" style="width:${t.progress}%"></div></div><div class="actions"><button class="btn" onclick="setProg('${a}','${b}',25)">25%</button><button class="btn" onclick="setProg('${a}','${b}',50)">50%</button><button class="btn" onclick="setProg('${a}','${b}',75)">75%</button><button class="btn primary" onclick="setProg('${a}','${b}',100)">Mark as Studied</button></div></div><div class="card" style="margin-top:14px"><h3>Notes</h3><div style="line-height:1.7;white-space:pre-wrap">${esc(t.notes)||'<span class="muted">No notes yet. Unlock editing to add some.</span>'}</div></div>`}
function recent(){header('Recently Studied','Your latest topics');let a=S.recent.map(k=>{let[x,y]=k.split(':');let s=S.subjects.find(q=>q.id===x),t=s?.topics.find(q=>q.id===y);return t?`<div class="card topic" onclick="go('topic','${x}:${y}')"><div><h3>${esc(t.name)}</h3><span class="muted">${esc(s.name)} · ${t.progress}%</span></div>›</div>`:''}).join('');app.innerHTML+=a||'<div class="empty">Nothing studied yet.</div>'}function favorites(){header('Favorites','Topics saved for later');let a=all().filter(t=>t.favorite).map(t=>`<div class="card topic" onclick="go('topic','${t.sid}:${t.id}')"><div><h3>★ ${esc(t.name)}</h3><span class="muted">${esc(t.sname)} · ${t.progress}%</span></div>›</div>`).join('');app.innerHTML+=a||'<div class="empty">No favorites yet.</div>'}
function search(){header('Search','Search subjects, topics and notes');app.innerHTML+=`<input class="search" style="max-width:none" autofocus placeholder="Search for glucose, quadratic, etc." oninput="doSearch(this.value)"><div id="res" style="margin-top:15px"></div>`}function doSearch(q){q=q.toLowerCase().trim();res.innerHTML=!q?'':(all().filter(t=>(t.name+' '+t.notes+' '+t.sname).toLowerCase().includes(q)).map(t=>`<div class="card topic" onclick="go('topic','${t.sid}:${t.id}')"><div><h3>${esc(t.name)}</h3><span class="muted">${esc(t.sname)} · ${esc(t.notes).slice(0,150)}</span></div>›</div>`).join('')||'<div class="empty">No results.</div>')}
function settings(){header('Settings','Study Hub preferences');app.innerHTML+=`<div class="card"><h3>Data</h3><p class="muted">Your shared Study Hub data is synced through Supabase. Export a backup before major changes.</p><div class="actions"><button class="btn" onclick="exportData()">Export JSON</button><button class="btn" onclick="importData()">Import JSON</button><button class="btn danger" onclick="clearData()">Clear data</button></div></div><div class="card" style="margin-top:14px"><h3>Account</h3><p class="muted">Signed in as <b>${esc(CURRENT_USER?.name||'')}</b> · ${esc(CURRENT_USER?.email||'')}</p><p class="muted">Group: <b>${esc(CURRENT_USER?.group||'')}</b></p><button class="btn danger" onclick="logout()">Sign out</button></div><div class="card" style="margin-top:14px"><h3>Editing lock</h3><p class="muted">Shared editing is protected by the group editing password.</p></div>`}
function addSubject(){lock(()=>modal('Add subject','<label>Name</label><input id="n" placeholder="Chemistry"><label>Icon</label><input id="i" placeholder="🧪">',()=>{S.subjects.push({id:uid(),name:n.value||'New Subject',icon:i.value||'•',color:'#7c83ff',topics:[]});save();close();render()}))}function editSubject(id){lock(()=>{let s=S.subjects.find(x=>x.id===id);modal('Edit subject',`<label>Name</label><input id="n" value="${esc(s.name)}"><label>Icon</label><input id="i" value="${esc(s.icon)}">`,()=>{s.name=n.value;s.icon=i.value;save();close();render()})})}function delSubject(id){const s=S.subjects.find(x=>x.id===id);if(!s)return;const password=window.prompt('Editing password:');if(password===null)return;if(password!=='5535548'){window.alert('Incorrect password.');return}if(!window.confirm('Delete '+s.name+' and all of its topics? This cannot be undone.'))return;S.subjects=S.subjects.filter(x=>x.id!==id);S.recent=S.recent.filter(k=>!k.startsWith(id+':'));save();location.hash='subjects';render()}function addTopic(sid){lock(()=>modal('Add topic','<label>Name</label><input id="n" placeholder="Topic name"><label>Notes</label><textarea id="c" placeholder="Study notes..."></textarea>',()=>{S.subjects.find(s=>s.id===sid).topics.push({id:uid(),name:n.value||'New Topic',status:'Not Started',progress:0,favorite:false,notes:c.value,updated:Date.now()});save();close();render()}))}function editTopic(sid,tid){lock(()=>{let t=S.subjects.find(s=>s.id===sid).topics.find(t=>t.id===tid);modal('Edit topic',`<label>Name</label><input id="n" value="${esc(t.name)}"><label>Status</label><select id="st"><option>Not Started</option><option>Learning</option><option>Reviewing</option><option>Mastered</option></select><label>Progress</label><input id="p" type="number" min="0" max="100" value="${t.progress}"><label>Notes</label><textarea id="c">${esc(t.notes)}</textarea>`,()=>{t.name=n.value;t.status=st.value;t.progress=Math.max(0,Math.min(100,+p.value));t.notes=c.value;t.updated=Date.now();save();close();render()});setTimeout(()=>st.value=t.status,0)})}function setProg(sid,tid,p){lock(()=>{let t=S.subjects.find(s=>s.id===sid).topics.find(t=>t.id===tid);t.progress=p;t.status=p===100?'Mastered':p>=70?'Reviewing':p?'Learning':'Not Started';t.updated=Date.now();save();render()})}function fav(sid,tid){let t=S.subjects.find(s=>s.id===sid).topics.find(t=>t.id===tid);t.favorite=!t.favorite;save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='study-hub-backup.json';a.click()}function importData(){lock(()=>{let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.subjects)throw 0;S=x;save();render()}catch(e){alert('Invalid backup')}};r.readAsText(i.files[0])};i.click()})}function clearData(){lock(()=>{if(confirm('Clear all data?')){localStorage.removeItem(KEY);location.reload()}})}
async function cloudJoinGroup(code){const normalized=String(code||'').replace(/[\u200B\u200C\u200D\uFEFF]/g,'').trim();const {data,error}=await sb.rpc('join_group_by_code',{p_code:normalized});if(error)throw error;CLOUD_GROUP_ID=data;return data}
async function cloudLoad(){if(!CURRENT_USER)return;const {data:members,error:me}=await sb.from('group_members').select('group_id').eq('user_id',CURRENT_USER.id).limit(1).maybeSingle();if(me)throw me;if(!members){CLOUD_READY=false;return}CLOUD_GROUP_ID=members.group_id;const {data:subs,error:se}=await sb.from('subjects').select('*,topics(*)').eq('group_id',CLOUD_GROUP_ID).order('position');if(se)throw se;S={subjects:(subs||[]).map(s=>({id:s.id,name:s.name,icon:s.icon||'📚',color:'#747bff',topics:(s.topics||[]).sort((a,b)=>a.position-b.position).map(t=>({id:t.id,name:t.name,status:t.status,progress:t.progress,favorite:false,notes:(t.content&&t.content.notes)||'',updated:new Date(t.updated_at).getTime()}))})),recent:[]};const {data:favs}=await sb.from('favorites').select('topic_id').eq('user_id',CURRENT_USER.id);const favSet=new Set((favs||[]).map(x=>x.topic_id));all().forEach(t=>{t.favorite=favSet.has(t.id)});localStorage.setItem(KEY,JSON.stringify(S));CLOUD_READY=true}
function isUuid(v){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v||''))}
function normalizeIds(){for(const s of S.subjects){if(!isUuid(s.id))s.id=crypto.randomUUID();for(const t of s.topics){if(!isUuid(t.id))t.id=crypto.randomUUID();}}}
async function cloudSave(){
  if(!CLOUD_READY||!CLOUD_GROUP_ID||!CURRENT_USER)return;
  normalizeIds();
  const subjectIds=S.subjects.map(s=>s.id);
  const {data:oldSubjects,error:oldSe}=await sb.from('subjects').select('id').eq('group_id',CLOUD_GROUP_ID);
  if(oldSe)throw oldSe;
  const staleSubjects=(oldSubjects||[]).map(x=>x.id).filter(id=>!subjectIds.includes(id));
  if(staleSubjects.length){const {error:e}=await sb.from('subjects').delete().in('id',staleSubjects);if(e)throw e;}
  for(let i=0;i<S.subjects.length;i++){
    const s=S.subjects[i];
    const {error:se}=await sb.from('subjects').upsert({id:s.id,group_id:CLOUD_GROUP_ID,name:s.name,icon:s.icon,position:i,updated_at:new Date().toISOString()});
    if(se)throw se;
    const topicIds=s.topics.map(t=>t.id);
    const {data:oldTopics,error:ot}=await sb.from('topics').select('id').eq('subject_id',s.id);
    if(ot)throw ot;
    const staleTopics=(oldTopics||[]).map(x=>x.id).filter(id=>!topicIds.includes(id));
    if(staleTopics.length){const {error:e}=await sb.from('topics').delete().in('id',staleTopics);if(e)throw e;}
    for(let j=0;j<s.topics.length;j++){
      const t=s.topics[j];
      const {error:te}=await sb.from('topics').upsert({id:t.id,subject_id:s.id,name:t.name,position:j,status:t.status,progress:t.progress,content:{notes:t.notes||''},updated_at:new Date(t.updated||Date.now()).toISOString()});
      if(te)throw te;
    }
  }
  localStorage.setItem(KEY,JSON.stringify(S));
}
const localSave=save;save=function(){localSave();cloudSave().catch(e=>{console.error('Cloud sync failed:',e);alert('Cloud sync failed: '+(e.message||'Unknown error'))})}
const localLogout=logout;logout=async function(){await sb.auth.signOut();localLogout()}
login=async function(e){e.preventDefault();authError('');let email=document.getElementById('loginEmail').value.trim().toLowerCase(),pw=document.getElementById('loginPassword').value;const {data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)return authError(error.message);const u=data.user;CURRENT_USER={id:u.id,name:u.user_metadata?.display_name||email,email:u.email,group:GROUP_CODE};saveSession();try{await cloudJoinGroup(GROUP_CODE);await sb.from('profiles').upsert({id:u.id,display_name:u.user_metadata?.display_name||email});await cloudLoad();auth();render()}catch(err){authError(err.message)}}
signup=async function(e){e.preventDefault();authError('');let name=document.getElementById('signupName').value.trim(),email=document.getElementById('signupEmail').value.trim().toLowerCase(),pw=document.getElementById('signupPassword').value,cp=document.getElementById('signupConfirm').value,group=(document.getElementById('signupGroup').value||'').replace(/[\u200B\u200C\u200D\uFEFF]/g,'').trim().toLowerCase();if(group!==GROUP_CODE.toLowerCase())return authError('Invalid group code. Use: qwerty-123456');if(pw!==cp)return authError('Passwords do not match.');const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name}}});if(error)return authError(error.message);if(!data.session)return authError('Account created. Check your email to confirm your account, then sign in.');CURRENT_USER={id:data.user.id,name,email,group};saveSession();try{await cloudJoinGroup(group);await sb.from('profiles').upsert({id:data.user.id,display_name:name});await cloudLoad();auth();render()}catch(err){authError(err.message)}}
resetPassword=async function(e){e.preventDefault();authError('');let email=document.getElementById('resetEmail').value.trim().toLowerCase(),group=document.getElementById('resetGroup').value.trim();if(group!==GROUP_CODE)return authError('Invalid group code.');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});if(error)return authError(error.message);authError('Password reset email sent.')}
async function bootCloud(){const {data}=await sb.auth.getSession();if(data.session){const u=data.session.user;CURRENT_USER={id:u.id,name:u.user_metadata?.display_name||u.email,email:u.email,group:GROUP_CODE};saveSession();try{await cloudJoinGroup(GROUP_CODE);await sb.from('profiles').upsert({id:u.id,display_name:u.user_metadata?.display_name||u.email});await cloudLoad()}catch(e){console.warn(e)}}else{CURRENT_USER=null;localStorage.removeItem(SESSION_KEY)}auth();render();sb.channel('study-hub-sync').on('postgres_changes',{event:'*',schema:'public',table:'subjects'},()=>cloudLoad().then(render).catch(()=>{})).on('postgres_changes',{event:'*',schema:'public',table:'topics'},()=>cloudLoad().then(render).catch(()=>{})).subscribe()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));app.addEventListener('click',function(e){const btn=e.target.closest('[data-delete-subject]');if(btn){e.preventDefault();e.stopPropagation();delSubject(btn.getAttribute('data-delete-subject'))}});window.onhashchange=render;bootCloud();
